<!doctype html>
<html lang="en" style="--project: {{colour}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="{{colour}}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="{{project}}">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="data:,">
<title>{{project}}</title>
<link rel="stylesheet" href="/design.css">
<script>
try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
// The backgrounds chosen for this project (`.dfs/background`), one per mode: the one for the mode
// the page is in sets its surface and text colours, and the light/dark switch picks between them.
let BACKGROUND = {{background_json}}, PALETTES = {{palettes_json}}, IMAGE = {{background_image_json}};
const isDark = () => document.documentElement.dataset.theme
  ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
function paintBackground() {
  const mode = isDark() ? "dark" : "light", root = document.documentElement, p = PALETTES[mode];
  for (const k of ["paper", "panel", "sel", "ink", "muted", "line", "faint"])
    p && p.paper ? root.style.setProperty("--" + k, p[k]) : root.style.removeProperty("--" + k);
  // the picture behind the page, one for each mode (`.dfs/background-image-light`, `-dark`); IMAGE holds their
  // versions, so a new one is fetched
  if (IMAGE[mode]) { root.style.setProperty("--picture", `url("/background-image?mode=${mode}&v=${IMAGE[mode]}")`); root.dataset.picture = ""; }
  else { root.style.removeProperty("--picture"); delete root.dataset.picture; }
}
paintBackground();
</script>
<style>
/* The picture behind the page, under a veil of the page's own paper at 90% so text keeps its contrast on any picture. */
:root[data-picture] body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: linear-gradient(color-mix(in srgb, var(--paper) 90%, transparent), color-mix(in srgb, var(--paper) 90%, transparent)), var(--picture) center / cover no-repeat; }
/* The page's own layout. What things ARE (type, colour, buttons, tags, fields, cards,
   dialogs) is the design system, /design.css; what is here is where they go. */
:root { --bar: calc(56px * var(--z)); --tabs: calc(52px * var(--z)); --col: calc(880px * var(--z)); --page: calc(1180px * var(--z)); }
body { padding-bottom: calc(var(--tabs) + env(safe-area-inset-bottom, 0px)); }

/* the bar: the mark, a name, a way back, and the three colours as one thin line */
#bar {
  border-top: var(--s1) solid var(--project-mark);
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: var(--s3);
  min-height: var(--bar); padding: 0 var(--s4); background: var(--paper); border-bottom: var(--rule) solid var(--line);
}
#bar::after { content: ""; position: absolute; left: 0; right: 0; bottom: -2px; height: var(--rule-strong);
  background: linear-gradient(90deg, var(--attention) 0 33.33%, var(--assumption-fill) 0 66.66%, var(--settled) 0 100%); }
#bar h1 { flex: 1; min-width: 0; margin: 0; font-size: var(--fs-body); line-height: 1.2; font-weight: 500; padding: var(--s2) 0; }
#bar h1 .rename { display: block; max-width: 100%; text-align: left; font: inherit; color: inherit; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-height: 28px; padding: 8px 0; margin: -8px 0; box-sizing: content-box; }
#bar h1 .rename:hover, #bar h1 .rename:focus-visible { text-decoration-color: var(--ink); }
#bar h1 small { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: var(--fs-label); font-weight: 400; color: var(--muted); letter-spacing: .04em; }
#bar .iconbtn { margin-right: -10px; }
#back[hidden], #live[hidden] { display: none; }
@media (max-width: 899px) { #back, .desk { display: none; } }          /* the bottom bar has these */
#live, #loading { font-size: var(--fs-label); color: var(--attention); letter-spacing: .08em; }
#loading { color: var(--muted); }
#loading[hidden] { display: none; }
/* a stripe slides under the header while a request is outstanding; it shows only after 250 ms */
#stripe { position: absolute; left: 0; right: 0; bottom: -2px; height: var(--rule-strong); overflow: hidden; z-index: 1; opacity: 0; transition: opacity var(--ease); pointer-events: none; }
#stripe::before { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 30%; background: var(--ink); animation: slide 1.1s ease-in-out infinite; }
html[data-loading] #stripe { opacity: 1; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
@media (prefers-reduced-motion: reduce) { #stripe::before { animation: none; width: 100%; } }
#view .wait { color: var(--muted); }

#layout { max-width: var(--page); margin: 0 auto; }
#view { padding: var(--s3) var(--s4) 28px; min-width: 0; }
#view.col { max-width: var(--col); margin: 0 auto; }
iframe.artview { display: block; width: 100%; height: calc(100dvh - var(--bar) - var(--tabs) - 3rem); min-height: 50dvh; border: var(--rule) solid var(--line); background: #fff; }
img.artview { max-width: 100%; height: auto; }
/* a run's log: wrapped to the screen, scrolling inside its own box so the page keeps its bars */
pre.runlog { margin: 0; padding: var(--s3); border: var(--rule) solid var(--line); background: var(--paper); font: var(--fs-small)/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  white-space: pre-wrap; overflow-wrap: anywhere; overflow: auto; min-height: 40dvh; max-height: calc(100dvh - var(--bar) - var(--tabs) - 9rem); }
.runhead { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; padding-bottom: var(--s3); }
a.runrow { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; min-height: calc(44px * var(--z)); padding: var(--s2) 0; color: inherit; text-decoration: none; border-top: var(--rule) solid var(--line); }
.runhead .muted, a.runrow .muted { font-size: var(--fs-small); }

/* tabs: two words; the current one carries a line */
#tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex;
  height: calc(var(--tabs) + env(safe-area-inset-bottom, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--paper); border-top: var(--rule) solid var(--line);
}
#tabs button { flex: 1; display: flex; align-items: center; justify-content: center; gap: var(--s2); font-size: var(--fs-control); font-weight: 500; letter-spacing: .12em; color: var(--muted); border-top: var(--rule-strong) solid transparent; margin-top: -1px; }
#tabs button[aria-current="page"] { color: var(--ink); border-top-color: var(--ink); }
.count { font-variant-numeric: tabular-nums; color: var(--assumption); }
.count[hidden] { display: none; }

/* the task list: ruled, with ids in a column */
.item { display: grid; grid-template-columns: 3.2rem minmax(0, 1fr); gap: 0 var(--s3); width: 100%; padding: var(--s4) 0; padding-left: calc(var(--ind, 0px) + var(--gx, 0px)); border-bottom: var(--rule) solid var(--line); }
.item.tint { margin: 0 -10px; width: calc(100% + 20px); --gx: 10px; padding-right: 10px; }
.item.assumes { background: var(--assumption-wash); }
.item.blocks { background: var(--attention-wash); }          /* a blocker is the more urgent: it wins */
.item:active { background: var(--sel); }
.item .iid { font-weight: 600; letter-spacing: .03em; }
.item .goal { font-weight: 500; overflow-wrap: anywhere; }
.item .meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s1) var(--s2); margin-top: 6px; font-size: var(--fs-control); }
.item .meta .tag { max-width: 100%; white-space: normal; overflow-wrap: anywhere; }   /* a long tag wraps inside its row: nowrap made it wider than the phone, and the page with it */
.item .st { font-size: var(--fs-label); font-weight: 500; letter-spacing: .12em; color: var(--muted); }
.item .st.done { color: var(--settled); } .item .st.blocked { color: var(--attention); }
/* a finished task recedes whole, so the open ones are what the eye lands on */
.item.done .iid, .item.done .goal { color: var(--muted); font-weight: 400; }
.item .st.done::before { content: "\2713\00a0"; }
/* and takes one line, not three: the goal is cut to a single line with the status after it, no why under it.
   The goal keeps at least that line: when the status and tags (not on main, uncommitted) leave it under 10rem
   they wrap to a second line under it, and the goal takes the first whole */
.item.done { padding-top: var(--s2); padding-bottom: var(--s2); }
.item.done .body { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--s1) var(--s2); min-width: 0; }
.item.done .goal { flex: 1 1 10rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item.done .meta { flex: 0 1 auto; min-width: 0; margin-top: 0; }
.item .why { grid-column: 2; margin-top: var(--s1); font-size: var(--fs-small); color: var(--muted); }
/* Reorder: the row stops being one button (its controls are buttons too) and grows a strip of moves under its text */
.item.reorder { cursor: default; }
.item.reorder:active { background: none; }
.item.reorder.moved { background: var(--sel); }
.item.reorder { grid-template-columns: 3.2rem minmax(0, 1fr) var(--hit); }
.moves { grid-column: 2; display: flex; flex-wrap: wrap; gap: var(--s2); margin-top: var(--s2); }
.moves .btn { min-width: var(--hit); padding: 0 var(--s3); }
/* the grip at the row's right edge: drag it to a new place among the siblings; the strip's arrows change the parent */
.grip { grid-column: 3; grid-row: 1 / span 3; align-self: center; justify-self: end; width: var(--hit); min-height: var(--hit); display: flex; align-items: center; justify-content: center; color: var(--muted); cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
.grip svg { width: calc(18px * var(--z)); height: calc(18px * var(--z)); fill: currentColor; pointer-events: none; }
.grip:focus-visible { outline: var(--rule-strong) solid var(--ink); }
.item.reorder.dragging { position: relative; z-index: 2; background: var(--paper); box-shadow: 0 2px 12px rgba(0, 0, 0, .3); }
.item.dragging .grip { cursor: grabbing; color: var(--ink); }
.item.drop-before, .item.drop-after { position: relative; }
.item.drop-before::after, .item.drop-after::after { content: ""; position: absolute; left: 0; right: 0; height: 4px; background: var(--ink); z-index: 3; }   /* above the lifted row, which covers what it passes over */
.item.drop-before::after { top: -2px; } .item.drop-after::after { bottom: -2px; }
body.dragging { user-select: none; -webkit-user-select: none; }
.break { margin: 18px 0 6px; display: flex; align-items: center; gap: var(--s3); }
.break::after { content: ""; flex: 1; border-top: var(--rule) solid var(--line); }
.hint { color: var(--muted); padding: 28px 0; }
p.foot { margin: var(--s5) 0 var(--s2); text-align: center; }
/* Add a task floats at the bottom right, clear of the tab bar; the gap keeps the last row from hiding under it */
.fab { position: fixed; right: var(--s4); bottom: calc(var(--tabs) + env(safe-area-inset-bottom, 0px) + var(--s4)); z-index: 5; min-height: calc(52px * var(--z)); padding: 0 var(--s5); }
.fab-gap { height: 72px; }
.top-actions { margin: var(--s2) 0 0; }

/* the walk */
.walk { margin: 6px 0 10px; border-bottom: var(--rule) solid var(--line); }
.walk > summary { min-height: calc(52px * var(--z)); display: flex; align-items: baseline; gap: var(--s3); padding: var(--s3) 0; cursor: pointer; list-style: none; flex-wrap: wrap; }
.walk > summary::-webkit-details-marker { display: none; }
.walk > summary .state { font-size: var(--fs-body); font-weight: 500; }
.walk > summary .brief { flex: 1; min-width: 0; color: var(--muted); font-size: calc(14px * var(--z)); }
.walk > summary .chev { margin-left: auto; align-self: center; width: var(--s2); height: var(--s2); border: solid var(--muted); border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); transition: transform var(--ease); }
.walk[open] > summary .chev { transform: rotate(-135deg); }
.walk .state .on { color: var(--settled); } .walk .state .hold { color: var(--assumption); }
.walk .line2 { color: var(--muted); font-size: var(--fs-small); margin: 0 0 6px; }
.walk .row2 { display: grid; grid-template-columns: 4.5rem minmax(0, 1fr); align-items: center; gap: 10px; margin: 10px 0; }
.walk .row2.act { margin-bottom: 14px; }
.walk label { font-size: var(--fs-label); font-weight: 500; letter-spacing: .12em; color: var(--muted); }
.walk .chain { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: var(--s2) 0; border-top: var(--rule) solid var(--faint); }
.walk .chain span:first-child { overflow-wrap: anywhere; }
.walk details { margin-top: 6px; }
.walk details > summary { min-height: calc(40px * var(--z)); display: flex; align-items: center; cursor: pointer; list-style: none; }
.walk details > summary::after { content: ""; margin-left: 10px; width: 6px; height: 6px; border: solid var(--muted); border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); }
.walk details[open] > summary::after { transform: rotate(-135deg); }
.walk details summary::-webkit-details-marker { display: none; }
.walk .ev { margin: 0; padding: 0 0 10px; list-style: none; font-size: calc(14px * var(--z)); color: var(--muted); }
.walk .ev li { padding: 2px 0; display: flex; gap: 10px; }
.walk .ev time { flex: none; width: 5.5em; font-variant-numeric: tabular-nums; }

/* one task */
.head h2 { margin: 10px 0 var(--s1); font-size: var(--fs-title); line-height: 1.25; font-weight: 500; text-wrap: balance; }
.head p { margin: 2px 0 0; font-size: var(--fs-small); }
details.sec.arts .body, details.sec.runs .body { white-space: normal; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(150px * var(--z)), 1fr)); gap: var(--s3); margin-bottom: var(--s3); }
a.tile { display: block; color: inherit; text-decoration: none; }
a.tile .thumb { display: block; position: relative; aspect-ratio: 3 / 2; overflow: hidden; border: var(--rule) solid var(--line); background: var(--faint); }
a.tile .thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top left; }
a.tile .thumb iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; pointer-events: none; background: #fff; }
a.tile .name { display: block; margin-top: var(--s1); font-size: var(--fs-small); overflow-wrap: anywhere; }
a.shot { display: block; margin: var(--s2) 0; } a.shot img { display: block; max-width: 100%; height: auto; border: var(--rule) solid var(--line); }

/* the tree: a column of hairlines; the left rule says what the node came to. --i is the row's indent in half
   steps: siblings share a column and a child, a chain step included, is always right of its parent. */
.tree { margin-top: var(--s2); }
.row { display: flex; align-items: stretch; margin-left: calc(var(--i, 0) * 6px); border-bottom: var(--rule) solid var(--faint); }
@media (min-width: 600px) { .row { margin-left: calc(var(--i, 0) * 10px); } }
.row .fold { flex: 0 0 calc(40px * var(--z)); min-height: calc(56px * var(--z)); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: calc(20px * var(--z)); }
.row .fold.none { visibility: hidden; }
.row .main { flex: 1; min-width: 0; padding: var(--s3) 6px var(--s3) 14px; border-left: var(--rule-status) solid var(--st, var(--line)); }
.row .main:active, .row.sel .main { background: var(--sel); }
.row.s-confirmed { --st: var(--settled); } .row.s-refuted { --st: var(--attention); }
.row.s-open { --st: var(--ink); } .row.s-parked, .row.s-dormant, .row.s-pruned { --st: var(--line); }
.row .line { overflow-wrap: anywhere; }
.row .mk { display: inline-block; width: 1.1em; margin-right: var(--s1); text-align: center; }
/* The circles are drawn, not typed: a font may fill U+25CB or outline U+25CF, and the two must never read alike. */
.row .mk.started, .row .mk.open { width: .72em; height: .72em; border: 2px solid currentColor; border-radius: 50%; box-sizing: border-box; margin: 0 calc(var(--s1) + .19em) 0 .19em; vertical-align: -.02em; }
.row .mk.started { background: currentColor; }
.row .nid { font-weight: 600; margin-right: var(--s2); letter-spacing: .03em; }
.row .chips { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; }
.row .skim { margin-top: var(--s1); font-size: var(--fs-small); color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row.quiet .line { color: var(--muted); }
.row.assumes .main { background: var(--assumption-wash); }
.row.assumes .nid { color: var(--assumption); }
.row.hasraise .main { background: var(--attention-wash); }
.row.hasraise .nid { color: var(--attention); }
.row.sel .main { box-shadow: inset 0 0 0 var(--rule) var(--ink); }
.row.overruled .skim { color: var(--attention); }

/* the node: a sheet from the bottom on a phone, a column beside the tree on a wide screen */
#sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; height: min(86dvh, 760px); display: none; flex-direction: column;
  background: var(--panel); border-top: var(--rule) solid var(--ink); padding-bottom: env(safe-area-inset-bottom, 0px);
}
#sheet.open { display: flex; }
#scrim { position: fixed; inset: 0; z-index: 7; background: var(--scrim); display: none; }
#scrim.open { display: block; }
.sheet-nav, .sheet-actions { flex: none; }
/* the node's own bar, at the bottom: Back leftmost, Next where the right thumb rests */
.sheet-nav { display: grid; grid-template-columns: repeat(4, 1fr); border-top: var(--rule) solid var(--line); }
.sheet-nav button { min-height: calc(56px * var(--z)); display: flex; align-items: center; justify-content: center; font-size: var(--fs-control); font-weight: 500; letter-spacing: .12em; text-align: center; }
.sheet-nav button + button { border-left: var(--rule) solid var(--faint); }
.sheet-nav button[data-act=next] { font-weight: 700; color: var(--ink); background: var(--sel); }
.sheet-nav button:disabled { color: var(--muted); opacity: .45; cursor: default; background: none; }
.sheet-nav button:not(:disabled):active { background: var(--sel); text-decoration: underline; text-underline-offset: 6px; }
.sheet-body .where { margin-bottom: var(--s1); font-variant-numeric: tabular-nums; }
.sheet-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: var(--s4) var(--s4) 20px; overscroll-behavior: contain; }
.sheet-body h3 { margin: 0 0 2px; font-size: var(--fs-title); line-height: 1.25; font-weight: 500; overflow-wrap: anywhere; }
.sheet-body .meta { color: var(--muted); font-size: calc(14px * var(--z)); letter-spacing: .04em; margin-bottom: var(--s1); }
.sheet-body h4 { margin: 20px 0 var(--s1); font-size: var(--fs-label); font-weight: 500; letter-spacing: var(--track-label); color: var(--muted); }
.sheet-body .raise h4 { margin: 0 0 var(--s2); }
.sheet-body h4.amber { color: var(--assumption); } .sheet-body h4.red { color: var(--attention); }
.sheet-body p, .sheet-body div.p { margin: 0 0 6px; white-space: pre-wrap; overflow-wrap: anywhere; max-width: var(--measure); }
.sheet-body .amber { color: var(--assumption); }
.sheet-body .plus { color: var(--settled); } .sheet-body .minus { color: var(--attention); }
.sheet-body .plus::before { content: "For \2014  "; font-size: var(--fs-label); font-weight: 500; letter-spacing: .12em; }
.sheet-body .minus::before { content: "Against \2014  "; font-size: var(--fs-label); font-weight: 500; letter-spacing: .12em; }
.sheet-body .red { color: var(--attention); } .sheet-body .dim { color: var(--muted); }
.sheet-body .raise { margin: var(--s3) 0; }
.sheet-actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(calc(96px * var(--z)), 1fr)); gap: 10px; padding: var(--s3) var(--s4); border-top: var(--rule) solid var(--line); }

/* chat: a conversation in a dialog of its own, full height on a phone */
#chat { width: min(720px, 100vw); max-width: 100vw; margin: auto; padding: 0; flex-direction: column; }
#chat[open] { display: flex; }
.chat-top { flex: none; display: flex; align-items: center; justify-content: center; min-height: calc(48px * var(--z)); padding: 0 var(--s4); border-bottom: var(--rule) solid var(--line); }
.chat-nav { grid-template-columns: repeat(4, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); }
.chat-nav button[data-act=chatclose] { font-weight: 700; }
#chat-log { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: var(--s4); overscroll-behavior: contain; }
.msg { margin: 0 0 var(--s3); max-width: var(--measure); }
.msg .who { display: block; margin-bottom: 2px; }
.msg .what { white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.you { padding: var(--s2) var(--s3); background: var(--sel); border-left: var(--rule-status) solid var(--ink); }
.msg.error { padding: var(--s2) var(--s3); background: var(--attention-wash); border-left: var(--rule-status) solid var(--attention); }
.msg.wait, .msg.note { color: var(--muted); }
pre { margin: var(--s2) 0; padding: var(--s2) var(--s3); background: var(--paper); border: var(--rule) solid var(--line); overflow-x: auto; font-size: var(--fs-small); white-space: pre; }
ul.md, ol.md { margin: var(--s1) 0; padding-left: 1.4em; white-space: normal; } ul.md li, ol.md li { margin: 0 0 2px; overflow-wrap: anywhere; }
.msg pre { margin: var(--s2) 0; padding: var(--s2) var(--s3); background: var(--paper); border: var(--rule) solid var(--line); overflow-x: auto; font-size: var(--fs-small); white-space: pre; }
#chat-form { flex: none; display: flex; flex-direction: row; gap: var(--s2); align-items: flex-end; padding: var(--s3) var(--s4); border-top: var(--rule) solid var(--line); }
#chat-form textarea { flex: 1; width: auto; min-height: var(--hit); max-height: calc(var(--vvh, 100dvh) * .3); resize: none; }
#chat-form .btn { flex: none; }
#chat-stop[hidden] { display: none; }

/* A keyboard shrinks the VISUAL viewport and may leave the layout one as it was: the dialogs
   are fitted to the visual one (--vvh, --vvt, set below), their fields scroll, and the row of
   actions sticks to the bottom of what is left, so nothing you press is ever under the keys. */
#form[open], #chat[open] { top: var(--vvt, 0px); bottom: calc(100dvh - var(--vvt, 0px) - var(--vvh, 100dvh)); max-height: var(--vvh, 100dvh); }
/* The chat is placed from the visual viewport alone (top and height, no bottom): a bottom
   taken from 100dvh is wrong wherever dvh and the viewport the browser fits disagree, and
   the over-constrained box then drifts under the keys. Wider than 900px it is centred. */
#chat[open] { bottom: auto; margin-block: 0; height: min(var(--vvh, 100dvh), 900px);
  top: calc(var(--vvt, 0px) + max(0px, (var(--vvh, 100dvh) - 900px) / 2)); }
#form form { max-height: var(--vvh, 100dvh); overflow-y: auto; overscroll-behavior: contain; }
#form .row-btns { position: sticky; bottom: calc(-1 * var(--s4)); margin-bottom: calc(-1 * var(--s4)); padding: var(--s2) 0 var(--s4); background: var(--panel); }
@media (min-width: 900px) {
  body { padding-bottom: 0; }
  #tabs { position: fixed; top: 0; left: auto; right: var(--s4); bottom: auto; width: auto; height: var(--bar); border: 0; background: transparent; padding: 0; gap: var(--s2); z-index: 7; }
  #tabs button { flex: none; padding: 0 14px; margin: 0; border-top: 0; border-bottom: var(--rule-strong) solid transparent; height: var(--bar); }
  #tabs button[aria-current="page"] { border-bottom-color: var(--ink); }
  #bar { padding-right: calc(400px * var(--z)); }
  #layout.has-node { display: grid; grid-template-columns: minmax(0, 1fr) minmax(calc(380px * var(--z)), 44%); gap: 0 28px; align-items: start; }
  #sheet { position: sticky; top: calc(var(--bar) + var(--s3)); right: auto; left: auto; bottom: auto; height: calc(100dvh - var(--bar) - 28px); border: var(--rule) solid var(--line); margin: var(--s3) var(--s4) 0 0; display: none; }
  #layout.has-node #sheet.open { display: flex; }
  .sheet-nav { order: -1; border-top: 0; border-bottom: var(--rule) solid var(--line); }
  .sheet-nav button { min-height: var(--hit); }
  #scrim { display: none !important; }
  #toast { top: auto; bottom: var(--s5); }
  .fab { bottom: var(--s5); right: var(--s5); }
}

/* the rail: the tasks beside the tree, so a switch is a click and not a trip back to the list. Only on a screen wide enough for three panes. */
#rail { display: none; }
.railitem { display: grid; grid-template-columns: 2.6em minmax(0, 1fr); gap: 0 var(--s2); width: 100%; padding: var(--s2) var(--s2) var(--s2) var(--s3); border-left: var(--rule-status) solid var(--st, transparent); border-bottom: var(--rule) solid var(--faint); font-size: var(--fs-small); }
.railitem .iid { font-weight: 600; }
.railitem .goal { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.railitem.done { color: var(--muted); }
.railitem.assumes { background: var(--assumption-wash); --st: var(--assumption-fill); }
.railitem.blocks { background: var(--attention-wash); --st: var(--attention); }
.railitem[aria-current="true"] { background: var(--sel); --st: var(--ink); box-shadow: inset 0 0 0 var(--rule) var(--ink); }
/* where a pointer rests, the thing under it says it can be pressed */
@media (hover: hover) {
  .item:hover, .railitem:hover, .row .main:hover { background: var(--sel); }
  .item.assumes:hover { background: var(--assumption-wash); filter: brightness(.96); }
  .item.blocks:hover { background: var(--attention-wash); filter: brightness(.96); }
}
/* the menu a right-click on a node opens: the sheet's own actions, at the pointer */
#ctx { position: fixed; z-index: 30; min-width: calc(180px * var(--z)); display: flex; flex-direction: column; background: var(--panel); border: var(--rule) solid var(--ink); }
#ctx[hidden] { display: none; }
#ctx button { min-height: var(--hit); padding: 0 var(--s4); font-size: var(--fs-control); font-weight: 500; letter-spacing: var(--track-control); }
#ctx button + button { border-top: var(--rule) solid var(--faint); }
#ctx button:hover, #ctx button:focus-visible { background: var(--sel); }
@media (min-width: 1500px) {
  /* three panes and no page cap: the screen is the layout. Tasks, then the tree, then the node. */
  #layout { max-width: none; }
  #layout.has-node { grid-template-columns: minmax(calc(230px * var(--z)), 19%) minmax(0, 1fr) minmax(calc(380px * var(--z)), 36%); gap: 0 var(--s5); }
  #layout.has-node #rail { display: block; position: sticky; top: calc(var(--bar) + var(--s3)); height: calc(100dvh - var(--bar) - 28px); overflow-y: auto; margin: var(--s3) 0 0 var(--s4); border-top: var(--rule) solid var(--line); overscroll-behavior: contain; }
  #bar { padding-left: var(--s5); }
}
</style>
</head>
<body>
<header id="bar">
  <div id="stripe" aria-hidden="true"></div>
  <svg class="mark" viewBox="110 110 300 300" role="img" aria-label="dfs"><path d="M150 140H256V236H362V336M256 236V318" fill="none" stroke="currentColor" stroke-width="26"/><rect x="128" y="118" width="44" height="44"/><circle cx="256" cy="236" r="30"/><rect x="208" y="318" width="96" height="30"/><circle cx="362" cy="352" r="40"/></svg>
  <button class="textbtn" id="back" hidden>Back</button>
  <h1 id="title">{{project}}</h1>
  <span id="loading" role="status" hidden>loading</span>
  <span id="live" hidden>reconnecting</span>
  <button class="iconbtn" id="theme" aria-label="Switch between light and dark"></button>
</header>
<nav id="tabs" aria-label="Navigate"></nav>
<div id="layout">
  <nav id="rail" aria-label="Tasks"></nav>
  <main id="view" aria-live="polite"><p class="wait">Loading…</p></main>
  <aside id="sheet" role="dialog" aria-label="Node" aria-modal="false"></aside>
</div>
<div id="scrim"></div>
<dialog id="form"></dialog>
<dialog id="chat" aria-label="Chat">
  <div class="chat-top"><span class="cap" id="chat-title"></span></div>
  <div id="chat-log" role="log" aria-live="polite"></div>
  <form id="chat-form"><textarea class="field" id="chat-input" rows="2" maxlength="4000" aria-label="Message" placeholder="Ask about this"></textarea><button class="btn" id="chat-stop" type="button" hidden>Stop</button><button class="btn primary" id="chat-send" type="submit">Send</button></form>
  <nav class="sheet-nav chat-nav" aria-label="Chat"><button data-act="chattop" aria-label="Scroll to the top of this message">↑ Top</button><button data-act="chatclear">New chat</button><button data-act="chatlist">Chats</button><button data-act="chatclose">Back</button></nav>
</dialog>
<div id="ctx" role="menu" hidden></div>
<div id="toast" role="status"></div>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let PROJECT = {{project_json}}, COLOUR = "{{colour}}", CHOSEN = {{colour_chosen}};
const S = { walk: null, state: null, task: null, taskId: null, folded: {}, only: false, reorder: false, moved: null, flagged: false, node: null, sig: "", dirty: false };
const wide = () => matchMedia("(min-width: 900px)").matches;

/* Loading: a request still outstanding after 250 ms shows "loading" and the stripe under the header
   and marks #view busy, so a slow link reads as waiting and not as a page that has stopped. Fast
   reads (the pushes and the polls) finish first and show nothing. */
let PENDING = 0, loadT;
function loading(delta) {
  PENDING += delta;
  if (PENDING <= 0) { PENDING = 0; clearTimeout(loadT); setLoading(false); }
  else if (delta > 0 && PENDING === delta) loadT = setTimeout(() => setLoading(true), 250);   // the wait began now
}
function setLoading(on) {
  if (on) document.documentElement.dataset.loading = "1"; else delete document.documentElement.dataset.loading;
  $("#loading").hidden = !on;
  $("#view").setAttribute("aria-busy", on ? "true" : "false");
}
async function api(path, body) {
  loading(1);
  try {
    const r = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    let j = {};
    try { j = await r.json(); } catch (e) { /* not JSON */ }
    if (!r.ok) throw new Error(j.error || ("error " + r.status));
    return j;
  } finally { loading(-1); }
}
let toastT;
function toast(msg, err) {
  const t = $("#toast");
  t.textContent = msg; t.className = "show" + (err ? " err" : "");
  clearTimeout(toastT); toastT = setTimeout(() => t.className = "", err ? 5000 : 2600);
}

/* ── routing: #/  #/t/W3  #/t/W3/W3.2  #/chats ─────────────────────────── */
function route(hash = location.hash) {
  const p = hash.replace(/^#\/?/, "").split("/").filter(Boolean).map(decodeURIComponent);
  if (p[0] === "t" && p[1]) return { view: "task", task: p[1], node: p[2] || null };
  if (p[0] === "chats") return { view: "chats" };
  if (p[0] === "a" && p[1] && p[2]) return { view: "artefact", task: p[1], name: p[2] };
  if (p[0] === "r" && p[1] && p[2]) return { view: "run", task: p[1], name: p[2] };
  return { view: "tasks" };
}
const go = (h, replace) => {
  if (!replace) return void (location.hash = "/" + h);
  HIST.replacing = "#/" + h !== location.hash;           // a replacement to the same hash fires no hashchange to clear it
  location.replace("#/" + h);
};
/* Back is a step back in history when the entry beneath is the screen it goes to, since pushing that screen
   again leaves the one just left a Back away: the list, the task, the list. `HIST` keeps the hash of each entry
   this tab has, by an index kept in `history.state` (which a reload and a traversal both bring back). */
const HIST = { n: 0, at: {}, replacing: false };
try { HIST.at = JSON.parse(sessionStorage.getItem("hist") || "{}") || {}; } catch (e) {}
const hkey = h => h.replace(/^#\/?/, "").replace(/\/+$/, "");
function histNote(first) {
  const st = history.state;
  if (st && typeof st.n === "number") HIST.n = st.n;
  else {
    if (!first && !HIST.replacing) HIST.n++;
    history.replaceState({ n: HIST.n }, "");
  }
  HIST.replacing = false;
  for (const k of Object.keys(HIST.at)) if (+k > HIST.n) delete HIST.at[k];
  HIST.at[HIST.n] = hkey(location.hash);
  try { sessionStorage.setItem("hist", JSON.stringify(HIST.at)); } catch (e) {}
}
histNote(true);
const leave = h => HIST.at[HIST.n - 1] === hkey(h) ? history.back() : go(h, true);
/* An artefact opens here, in this app's own window, since an installed app has no browser bar to come
   back from a bare file. `NAVS` counts every hashchange in this page (replacements too), so it is only
   ever tested for nonzero: Back can tell "the screen I came from" (history.back) from "opened by a
   reload or a link", which goes to the task. */
let NAVS = 0;

/* Each screen's page scroll is kept for the tab's session (so Back to the list, and a reload, land
   where the reader was). Scrolls are not recorded while a screen is changing: the short page that
   is there until the new one draws would overwrite the saved offset with 0. */
const SCROLL = { at: {}, ready: false, t: null };
try { SCROLL.at = JSON.parse(sessionStorage.getItem("scroll") || "{}") || {}; } catch (e) {}
function scrollBack(where) {
  window.scrollTo(0, SCROLL.at[where] || 0);
  SCROLL.ready = true;
}
function keepScroll(key, y) {
  if (y == null) delete SCROLL.at[key]; else SCROLL.at[key] = Math.round(y);
  clearTimeout(SCROLL.t);
  SCROLL.t = setTimeout(() => { try { sessionStorage.setItem("scroll", JSON.stringify(SCROLL.at)); } catch (e) {} }, 150);
}
addEventListener("scroll", () => { if (SCROLL.ready && lastView) keepScroll(lastView, window.scrollY); }, { passive: true });
addEventListener("pagehide", () => { try { sessionStorage.setItem("scroll", JSON.stringify(SCROLL.at)); } catch (e) {} });

let lastView = "";
let RENDERS = 0;
async function render(force) {
  // A render is a fetch and then a draw, and a newer one can start before an older one
  // lands: an older list render finishing after the tap on a task drew the list over it.
  // Only the newest draws.
  const mine = ++RENDERS;
  const r = route();
  const where = r.view + ":" + (r.task || "");
  if (where !== lastView) { lastView = where; SCROLL.ready = false; window.scrollTo(0, 0); S.sig = ""; }
  try {
    if (r.view === "task") {
      if (S.taskId !== r.task) { S.task = null; S.taskId = r.task; }
      let t;
      [t, S.walk] = await Promise.all([api("/api/task/" + encodeURIComponent(r.task)), api("/api/walk")]);
      if (mine !== RENDERS) return;
      S.node = r.node;
      const sig = JSON.stringify(t) + "|" + r.node + "|" + JSON.stringify([...(S.folded[r.task] || [])]) + "|" + S.flagged + "|" + (S.walk && S.walk.pinned) + "|" + JSON.stringify(walkOf(r.task));
      S.task = t;
      if (sig !== S.sig || force) { S.sig = sig; drawTask(); }
    } else if (r.view === "artefact") {
      const t = await api("/api/task/" + encodeURIComponent(r.task));
      if (mine !== RENDERS) return;
      S.task = t; S.taskId = r.task; S.node = null;
      drawArtefact(r);
    } else if (r.view === "run") {
      S.node = null;
      await drawRun(r, mine);
    } else if (r.view === "chats") {
      const [list, state] = await Promise.all([api("/api/chats"), api("/api/state")]);
      if (mine !== RENDERS) return;
      S.chats = list.chats; S.state = state; S.needs = state.needs_you; syncColour(state); S.node = null; drawChats();
    } else {
      const [state, walk] = await Promise.all([api("/api/state"), api("/api/walk")]);
      if (mine !== RENDERS) return;
      S.state = state; S.needs = state.needs_you; S.walk = walk; syncColour(state);
      S.node = null; drawTasks();
    }
    chrome(r);
    if (r.view === "task") refreshNeeds();
    if (!SCROLL.ready && mine === RENDERS) scrollBack(where);
  } catch (e) {
    toast(e.message, true);
    // Nothing has drawn yet, so "Loading…" would claim a wait that has ended: say what failed.
    const wait = $("#view .wait");
    if (mine === RENDERS && wait)
      $("#view").innerHTML = `<p class="wait" role="alert">Could not load: ${esc(e.message)}</p><div class="actions top-actions"><button class="btn" data-act="retry">Retry</button></div>`;
  }
}
// A task screen does not load the list, but the bar's Needs you carries the count.
async function refreshNeeds() {
  try { S.state = await api("/api/state"); S.needs = S.state.needs_you; drawBar(route()); drawRail(); } catch (e) { /* a count is a convenience */ }
}
/* The rail beside a task's tree on a wide screen: every task, the one you are in marked. It is drawn only when the
   tasks changed, so a push does not take the scroll from under a pointer. */
function drawRail() {
  const rail = $("#rail"), r = route();
  if (r.view !== "task" || !S.state) return;
  const html = S.state.items.map(it => {
    const blocks = it.status === "blocked" || it.raises > 0, assumes = !blocks && it.assumptions.length > 0;
    return `<button class="railitem${blocks ? " blocks" : assumes ? " assumes" : ""}${it.status === "done" ? " done" : ""}" data-act="task" data-id="${esc(it.id)}" aria-current="${it.id === r.task}" title="${esc(it.goal)}"><span class="iid">${esc(it.id)}</span><span class="goal">${esc(it.goal)}</span></button>`;
  }).join("");
  if (rail.dataset.sig !== html) {
    const was = rail.scrollTop; rail.innerHTML = html; rail.dataset.sig = html; rail.scrollTop = was;
  }
  const cur = $('[aria-current="true"]', rail);
  if (cur && rail.dataset.at !== r.task) { rail.dataset.at = r.task; rail.scrollTop = Math.max(0, cur.offsetTop - rail.offsetTop - rail.clientHeight / 3); }
}
/* The bar at the bottom is where the thumbs are, so it holds what you press to move: on a phone,
   Back is always its right cell, under the right thumb, with what moves you on the left, and what is next to it is what that screen leads to. On a wide
   screen it is the same cells, up at the top, and Back is in the header. */
function drawBar(r) {
  const cell = (attrs, label, cur) => `<button ${attrs} ${cur ? 'aria-current="page"' : ""}>${label}</button>`;
  const list = r.view === "tasks";
  let html, mode;
  if (r.view === "artefact" || r.view === "run") {
    mode = "artefact";
    html = `<button data-act="up">Back</button>`;
  } else if (r.view !== "task" || wide()) {
    mode = "tabs";
    html = cell('data-act="only" data-v="0"', "All", list && !S.only && !S.reorder)
      + cell('data-act="only" data-v="1"', `Needs you <span class="count">${S.needs || ""}</span>`, list && S.only)
      + cell('data-act="reorder"', "Reorder", list && S.reorder)
      + (chatOn() ? `<button data-tab="chats" ${r.view === "chats" ? 'aria-current="page"' : ""}>Chats</button>` : "");
  } else {
    mode = "task";
    const flagged = S.task ? S.task.assumed.length : 0;
    html = (chatOn() ? `<button data-act="chat" data-scope="${esc(r.task)}">Chat</button>` : "")
      + (flagged ? `<button data-act="nextflag">Flagged ${flagged}</button>` : "")
      + `<button data-act="up">Back</button>`;
  }
  const bar = $("#tabs");
  if (bar.dataset.sig !== mode + html) { bar.innerHTML = html; bar.dataset.sig = mode + html; }
  bar.dataset.mode = mode;
}
function chrome(r) {
  drawBar(r);
  $("#back").hidden = r.view === "tasks" || r.view === "chats";
  const t = $("#title");
  if (r.view === "task" && S.task) t.innerHTML = `${esc(S.task.id)}<small>${esc(S.task.status)}${S.task.accepted ? ", accepted" : ""}</small>`;
  else if (r.view === "artefact") { const a = artefactOf(r); t.innerHTML = `${esc(a ? a.title : r.name)}<small>${esc(r.task)}, artefact</small>`; }
  else if (r.view === "run") t.innerHTML = `${esc(RUNLOG.info ? RUNLOG.info.progress : "Run")}<small>${esc(r.task)}, run log</small>`;
  else if (r.view === "chats") t.innerHTML = `Chats<small>${S.chats ? S.chats.length : 0} going, any of them yours to pick up</small>`;
  else if (S.state) t.innerHTML = `<button class="rename" data-act="rename" aria-label="Rename the project">${esc(PROJECT)}</button><small>${S.state.items.length} tasks, ${S.state.needs_you} need you</small>`;
  document.title = (r.view === "task" ? r.task + " · " : r.view === "artefact" ? r.name + " · " : r.view === "run" ? r.task + " log · " : "") + PROJECT;
  const open = r.view === "task" && !!r.node && !!S.task && S.task.rows.some(x => x.key === r.node);
  $("#sheet").classList.toggle("open", open);
  $("#scrim").classList.toggle("open", open && !wide());
  $("#layout").classList.toggle("has-node", r.view === "task");
  if (r.view === "task" && !open) $("#sheet").innerHTML = wide() ? `<p class="hint" style="padding:0 16px">Pick a node to read it here.</p>` : "";
  if (open) drawSheet();
}

/* ── the walk: start it, stop it, choose where it goes next ─────────────────────── */
function walkHtml() {
  const w = S.walk;
  if (!w || !w.enabled) return "";
  const chain = w.chain && w.chain.live ? w.chain : null;
  const state = w.on
    ? (w.hold ? `<span class="hold">Holding ${Math.ceil(w.hold / 60)} min for a usage limit</span>` : w.pending ? `<span class="hold">Waiting for a task</span>` : `<span class="on">Walking</span>`)
    : "Walk is off";
  const line2 = w.on
    ? `${w.used} of ${w.budget} sessions used${chain ? `. Now ${esc(chain.item)}, ${esc(chain.progress)}.` : w.pending ? ". Nothing is workable; it takes the next task that appears." : "."}`
    : (w.note ? `Stopped: ${esc(w.note)}.` : `A walk works the tasks depth-first, under a budget of sessions.`);
  const auto = w.auto ? `Automatic: ${esc(w.auto)}` : "Automatic: nothing is workable";
  const options = [`<option value="">${auto}</option>`].concat(w.candidates.map(c =>
    `<option value="${esc(c.id)}" ${w.pinned === c.id ? "selected" : ""}>${esc(c.id)}  ${esc(c.goal)}</option>`)).join("");
  const agents = (w.agents || []).map(a => `<option value="${esc(a)}" ${w.agent === a ? "selected" : ""}>${esc(a)}</option>`).join("");
  const others = w.live.filter(c => !(chain && c.item === chain.item));
  const chains = (chain ? [{ item: chain.item, progress: chain.progress }] : []).concat(others).map(c =>
    `<div class="chain"><span><b>${esc(c.item)}</b> ${esc(c.progress)}</span><button class="btn danger" data-act="chainstop" data-item="${esc(c.item)}">Stop chain</button></div>`).join("");
  const events = w.events.length ? `<details><summary class="cap">Activity</summary><ul class="ev">${w.events.slice(0, 6).map(e =>
    `<li><time>${esc(e.age)}</time><span>${esc(e.text)}</span></li>`).join("")}</ul></details>` : "";
  const brief = w.on ? `${w.used}/${w.budget} sessions${chain ? ", " + esc(chain.item) : ""}` : `next ${esc(w.pinned || w.auto || "none")} · ${esc(w.agent)}`;
  const open = S.walkOpen === true;
  return `<details class="walk" id="walkbox" ${open ? "open" : ""}><summary><span class="cap">Walk</span><span class="state">${state}</span><span class="brief">${brief}</span><span class="chev" aria-hidden="true"></span></summary>
    <p class="line2">${line2}</p>
    <div class="row2"><label for="nextsel">Next</label><select id="nextsel">${options}</select></div>
    <div class="row2"><label for="agentsel">Agent</label><select id="agentsel">${agents}</select></div>
    <div class="row2 act"><span></span>${w.on ? `<button class="btn" data-act="walkstop">Stop walk</button>` : `<button class="btn primary" data-act="walkstart">Start walk</button>`}</div>
    ${chains}${events}</details>`;
}
async function setAgent(agent) {
  try { S.walk = await api("/api/walk/agent", { agent }); toast("The next chain uses " + agent + "."); drawTasks(); }
  catch (e) { toast(e.message, true); render(true); }
}
async function setNext(item) {
  try { S.walk = await api("/api/walk/pin", { item: item || null }); toast(item ? "Next goes to " + item + "." : "Next is automatic."); drawTasks(); }
  catch (e) { toast(e.message, true); render(true); }
}
function walkStartForm() {
  form(`<h3>Start the walk?</h3>
    <p class="muted" style="margin:0">It starts agent sessions on this machine, one chain at a time, depth-first, until the budget is spent or you stop it, waiting for a new task when every branch is blocked or finished. They run with the agent's permission prompts off.</p>
    <div><label for="bud">Budget, in sessions</label><input type="number" id="bud" name="budget" min="1" max="500" value="${esc(S.walk.budget)}" required></div>${buttons("Start walk")}`,
    async fd => { S.walk = await api("/api/walk/start", { budget: parseInt(fd.get("budget"), 10) }); toast("Walking."); drawTasks(); });
}
function chainStopForm(item) {
  form(`<h3>Stop ${esc(item)}'s chain?</h3>

(function () {                          // the visual viewport is what the keyboard leaves

    const s = document.documentElement.style; s.setProperty("--vvh", vv.height + "px"); s.setProperty("--vvt", vv.offsetTop + "px");
    if (end) log.scrollTop = log.scrollHeight;       // the newest message stays in view above the input
  };

/* The page a raise names to answer with (`Answer with: .dfs/artefacts/<name>.html`, one page even when the raise

const chatKey = () => "chat:" + CHAT.scope;
function chatDraw(st) {
  // 80px of slack: a reader near the end is carried along by a new message; Top (below) is exact, 4px
  const log = $("#chat-log"), atEnd = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  const who = { you: "You", agent: "Agent", error: "Not answered" };
  const sig = JSON.stringify([st.messages, st.busy, st.busy_for, st.live, st.elsewhere, st.note]);
  if (sig === CHAT.last) return;
  CHAT.last = sig;
  log.innerHTML = (st.elsewhere ? `<p class="muted">Another terminal has this conversation open. Type there; what is said shows here.</p>` : st.live ? `<p class="muted">Running in the terminal's process: type here, or press <code>c</code> there to look at it.</p>` : "")
    + (st.note ? `<p class="muted">${esc(st.note)}</p>` : "")
    + (st.messages.length ? "" : `<p class="muted">Ask about ${CHAT.scope === "project" ? "the project" : "this task"}: where the work is, what was refuted and why, what to do next. It can read the roadmap and the task; it changes nothing.</p>`)
    + st.messages.map(m => `<div class="msg ${esc(m.role)}"><span class="who cap">${who[m.role] || esc(m.role)}</span><div class="what">${m.role === "agent" ? md(m.text) : esc(m.text)}</div></div>`).join("")
    + (st.busy ? `<div class="msg wait"><span class="who cap">Agent</span><div class="what">Thinking… ${st.busy_for}s</div></div>` : "");

  // A busy turn redraws every poll ("Thinking… Ns"), so only a reader at the end, or one who has just sent, is carried down.

// The Top button: to the top of the message being read. That is the last one when the log is at its end
// (a long answer has just landed there), else the one crossing the log's top edge; already at its top, the one before.
function chatTop() {
  const log = $("#chat-log"), box = log.getBoundingClientRect().top, pad = parseFloat(getComputedStyle(log).paddingTop) || 0;
  const tops = [...log.querySelectorAll(".msg:not(.wait)")].map(m => Math.max(0, Math.round(m.getBoundingClientRect().top - box + log.scrollTop - pad)));
  if (!tops.length) return;
  const at = log.scrollTop, atEnd = log.scrollHeight - at - log.clientHeight < 4;
  let i = atEnd ? tops.length - 1 : tops.reduce((n, t, j) => t <= at ? j : n, 0);

    <p class="muted" style="margin:0">It leaves the list and the order. Its files are kept under <code>.dfs/archive/deleted/</code>, so moving them back restores it; its number is not used again.</p>${buttons("Delete task")}`,
    async () => {
      const res = await api("/api/delete_task", { task: t.id });
      toast("Deleted " + res.deleted + "."); S.task = null; S.sig = ""; go(""); await render(true); });
}
function deleteNodeForm(id) {
  const rows = S.task.rows.filter(x => x.kind === "node"), under = [];
  for (const x of rows) { let p = x.parent; while (p) { if (p === id) { under.push(x.id); break; } const up = rows.find(y => y.id === p); p = up ? up.parent : ""; } }
  form(`<h3>Delete ${esc(id)}?</h3>
    <p class="warn">${under.length ? `This also deletes the ${under.length} node${under.length === 1 ? "" : "s"} under it: ${under.map(esc).join(", ")}.` : "Nothing is under it."}</p>
    <p class="muted" style="margin:0">Whatever its status. The task's log keeps what was cut; the node numbers are not used again.</p>${buttons("Delete")}`,
    async () => { const res = await api("/api/delete_node", { task: S.task.id, node: id }); await wrote(res, "Deleted " + res.deleted.join(", ") + "."); go(`t/${S.task.id}`, true); });
}
function addForm(parent) {
  const p = parent && S.task.rows.find(x => x.key === parent);
  const dead = p && ["refuted", "pruned"].includes(p.status);
  form(`<h3>Add a node ${parent ? "under " + esc(parent) : ""}</h3>
    ${dead ? `<p class="warn">${esc(parent)} is ${esc(p.status)}, so a node under it is pruned too.</p>` : ""}
    <div><label for="t">Title</label>${line("t", "title", "")}</div>
    <div><label for="a">Approach, optional: what to do, where, and the check</label><textarea id="a" name="approach"></textarea></div>${buttons("Add")}`,
    async fd => { const res = await api("/api/add", { task: S.task.id, parent: parent || null, title: fd.get("title"), approach: fd.get("approach") }); await wrote(res, "Added " + res.added + "."); });
}
function acceptForm() {
  const a = S.task.assumed;
  form(`<h3>Accept ${esc(S.task.id)}'s tree as finished?</h3>
    ${a.length ? `<p class="muted" style="margin:0">It rests on ${a.length} assumption${a.length === 1 ? "" : "s"} you have not accepted:</p>
      <ul>${a.map(x => `<li><b>${esc(x.id)}</b> ${x.wrong ? "wrong if " + esc(x.wrong) : esc(x.ask || x.assumption)}</li>`).join("")}</ul>` : `<p class="muted" style="margin:0">Nothing in it states an assumption.</p>`}
    ${S.task.notes.length ? `<p class="warn">What the ${S.task.notes.length === 1 ? "reviewer said" : "reviewer and critic said"}:</p>
      <div class="quote">${S.task.notes.map(n => esc(n.kind + " " + n.verdict + ": " + n.body)).join("\n\n")}</div>` : ""}
    ${buttons("Accept")}`,
    async () => wrote(await api("/api/accept", { task: S.task.id }), "Accepted."));
}

/* ── events ─────────────────────────────────────────────────────────────────── */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"), tab = e.target.closest("[data-tab]");
  if (tab) return go(tab.dataset.tab === "tasks" ? "" : tab.dataset.tab);
  // An artefact link in a dialog (the chat's replies) opens the viewer in #view, which a modal dialog covers: close it first.
  if (e.target.closest("a.art, a.shot")) for (const d of document.querySelectorAll("dialog[open]")) d.close();
  if (e.target.id === "scrim") return leave(`t/${S.task.id}`);
  if (!b || b.disabled) return;
  const d = b.dataset;
  ({
    retry: () => render(true),
    flagged: () => { S.flagged = !S.flagged; S.sig = ""; render(true); },
    only: () => { S.only = d.v === "1"; S.reorder = false; S.moved = null; showList(); },
    reorder: () => { S.reorder = route().view === "tasks" ? !S.reorder : true; S.moved = null; if (S.reorder) S.only = false; showList(); },
    move: () => moveTask(d.id, d.move),
    task: () => go("t/" + d.id),
    node: () => go(`t/${S.task.id}/${d.id}`, !!S.node),
    fold: () => { const s = S.folded[S.task.id] ||= new Set(); s.has(d.id) ? s.delete(d.id) : s.add(d.id); S.sig = ""; render(true); },
    close: () => leave(`t/${S.task.id}`), up,
    prev: () => step(-1), next: () => step(1), nextflag: nextFlag,
    answer: () => answerForm(d.ts), correct: () => correctForm(d.id), rename: renameForm, newtask: newTaskForm, edittask: editTaskForm, deletetask: deleteTaskForm, deletenode: () => deleteNodeForm(d.id), editnode: () => editNodeForm(d.id),
    chat: () => chatOpen(d.scope), chattop: chatTop, chatclose: () => $("#chat").close(), chatlist: () => { $("#chat").close(); go("chats"); },
    chatclear: async () => { try { CHAT.last = ""; keepScroll(chatKey()); chatDraw(await api("/api/chat/clear", { scope: CHAT.scope })); chatBegin(CHAT.scope); } catch (e) { toast(e.message, true); } },
    add: () => addForm(d.parent), accept: acceptForm,
    walkstart: walkStartForm, walkstop: async () => { try { S.walk = await api("/api/walk/stop", {}); toast("Walk stopped; its chain ends after this run."); drawTasks(); } catch (e) { toast(e.message, true); } },
    chainstop: () => chainStopForm(d.item),
    walkhere: async () => { try { S.walk = await api("/api/walk/pin", { item: d.item }); toast(S.walk.pinned ? "The walk goes to " + d.item + " next." : "Next is automatic."); S.sig = ""; render(true); } catch (e) { toast(e.message, true); } },
  }[d.act] || (() => {}))();
});
// The bar's All, Needs you and Reorder set how the list is drawn; from another screen they take you to it.
// Reorder gives every row a strip of moves, so the rows change height and the page's old offset lands on other
// tasks. The first row on screen is found before the redraw and put back where it was after it.
function showList() {
  if (route().view !== "tasks") return go("");
  const key = el => el.dataset.row || el.dataset.id;
  const at = [...document.querySelectorAll("#view .item")].find(el => el.getBoundingClientRect().bottom > 0);
  const was = at && { id: key(at), top: at.getBoundingClientRect().top };
  drawTasks();
  const now = was && [...document.querySelectorAll("#view .item")].find(el => key(el) === was.id);
  if (now) window.scrollBy(0, now.getBoundingClientRect().top - was.top);
  drawBar(route());
}
const up = () => {
  const r = route();
  if (r.view === "artefact" || r.view === "run") return NAVS ? history.back() : go(`t/${r.task}`, true);
  if (S.node) leave(`t/${S.task.id}`); else leave("");
};
$("#back").onclick = up;
$("#sheet").addEventListener("scroll", e => { if (S.node && e.target.isConnected && e.target.classList.contains("sheet-body")) keepScroll(sheetKey(), e.target.scrollTop); }, true);
$("#chat-log").addEventListener("scroll", e => {
  const l = e.target; if (!CHAT.scope || CHAT.fresh) return;
  keepScroll(chatKey(), l.scrollHeight - l.scrollTop - l.clientHeight < 40 ? null : l.scrollTop);
}, { passive: true });
matchMedia("(min-width: 900px)").addEventListener("change", () => render(true));
addEventListener("hashchange", () => { NAVS++; histNote(); render(true); });
document.addEventListener("toggle", e => { if (e.target.id === "runs") S.runsOpen = e.target.open; }, true);
setInterval(() => { if (route().view === "run" && RUNLOG.info && RUNLOG.info.state === "live" && !document.hidden) render(true); }, 2000);
setInterval(() => { if (route().view === "chats" && !document.hidden && !$("#chat").open) render(true); }, 4000);
addEventListener("keydown", e => {
  if (e.target.closest("dialog, input, textarea") || e.metaKey || e.ctrlKey) return;
  if (!S.task || route().view !== "task") return;
  const open = S.node && S.task.rows.find(x => x.key === S.node);
  if (e.key === "j") step(1); else if (e.key === "k") step(-1); else if (e.key === "n") nextFlag();
  else if (e.key === "Escape" && S.node) leave(`t/${S.task.id}`);
  else if (e.key === "Enter" && !S.node && e.target === document.body) { const first = visibleRows(S.task).find(x => x.kind === "node"); if (first) go(`t/${S.task.id}/${first.id}`); }
  else if (e.key === "c" && open) correctForm(open.id);
  else if (e.key === "f") { S.flagged = !S.flagged; S.sig = ""; render(true); }
});
/* Right-click on a node: its actions at the pointer, the same ones the sheet has. Any click, Escape or scroll closes it. */
function ctxClose() { const m = $("#ctx"); if (!m.hidden) { m.hidden = true; m.innerHTML = ""; } }
document.addEventListener("contextmenu", e => {
  const main = e.target.closest && e.target.closest(".row .main[data-act=node]");
  if (!main || !S.task) return ctxClose();
  e.preventDefault();
  const id = main.dataset.id, r = S.task.rows.find(x => x.id === id), m = $("#ctx");
  m.innerHTML = `<button role="menuitem" data-act="node" data-id="${esc(id)}">Open ${esc(id)}</button>
    <button role="menuitem" data-act="correct" data-id="${esc(id)}">Refute/confirm</button>
    ${r && r.editable ? `<button role="menuitem" data-act="editnode" data-id="${esc(id)}">Edit</button>` : ""}
    <button role="menuitem" data-act="add" data-parent="${esc(id)}">Add under</button>
    <button role="menuitem" data-act="deletenode" data-id="${esc(id)}">Delete</button>`;
  m.hidden = false;
  m.style.left = Math.max(0, Math.min(e.clientX, innerWidth - m.offsetWidth)) + "px";
  m.style.top = Math.max(0, Math.min(e.clientY, innerHeight - m.offsetHeight)) + "px";
  $("button", m).focus();
});
document.addEventListener("click", ctxClose, true);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#ctx").hidden) { ctxClose(); e.stopPropagation(); } }, true);
addEventListener("scroll", ctxClose, { passive: true });
matchMedia("(min-width: 900px)").addEventListener("change", () => render(true));
document.addEventListener("change", e => { if (e.target.id === "nextsel") setNext(e.target.value); else if (e.target.id === "agentsel") setAgent(e.target.value); });

/* ── being told: the server pushes `change` when the roadmap does ──────────────── */
let pushT;
function listen() {
  if (!window.EventSource) return;
  const es = new EventSource("/api/events");
  es.addEventListener("change", () => {
    clearTimeout(pushT);
    pushT = setTimeout(() => { if ($("#chat").open) chatLoad(); if ($("#form").open) S.dirty = true; else render(false); }, 120);
  });
  es.onopen = () => { $("#live").hidden = true; };
  es.onerror = () => { $("#live").hidden = false; };     // the browser reconnects by itself
}
if ("serviceWorker" in navigator && isSecureContext) navigator.serviceWorker.register("/sw.js").catch(() => {});
const NO_INSTALL = "Chrome on Android installs this page only over https (or on localhost), and this address is plain http. See the README, “The web page on a phone”.";
if (!isSecureContext && /Android/.test(navigator.userAgent) && !sessionStorage.getItem("noInstall")) {
  sessionStorage.setItem("noInstall", "1"); toast(NO_INSTALL, true);
}
const dark = isDark;
const SUN = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"/></svg>';
function themeLabel() {
  const b = $("#theme"), d = dark();
  paintBackground();
  b.innerHTML = d ? MOON : SUN;                         // the icon is the mode you are in
  b.title = b.ariaLabel = d ? "Dark. Switch to light" : "Light. Switch to dark";
}
$("#theme").onclick = () => {
  const next = dark() ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("theme", next); } catch (e) {}
  themeLabel();
};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", themeLabel);
themeLabel();
listen();
render(true);
</script>
