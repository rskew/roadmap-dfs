<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What the web page's search matches</title>

<style>
  body { margin: 0; padding: 16px; background: #fbfaf7; color: #1a1a1a;
         font: 16px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif; max-width: 720px; }
  @media (min-width: 720px) { body { padding: 28px 32px; } }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 22px 0 6px; }
</style>
<style>
  .box { border: 1.5px solid #333; border-radius: 6px; background: #fff; padding: 10px 12px; margin: 8px 0; }
  .ctl label { display: flex; gap: 10px; align-items: center; min-height: 44px; }
  .ctl input[type=checkbox] { width: 32px; height: 32px; flex: none; }
  #q { width: 100%; box-sizing: border-box; font: inherit; padding: 8px; min-height: 44px; }
  ul.rows { list-style: none; margin: 8px 0; padding: 0; }
  ul.rows li { padding: 6px 8px; border-left: 4px solid #2a7; margin: 4px 0; background: #fff; }
  ul.rows li.out { border-left-color: #bbb; color: #888; text-decoration: line-through; }
  ul.rows li.fold::before { content: "\2212  "; }
  .id { font-family: ui-monospace, monospace; font-weight: 600; }
  .small { color: #555; font-size: 14px; }
</style>
<h1>What the web page's search matches</h1>
<p>The first session to add search chose four defaults and never wrote them down. Type a query and switch each default to see what it would keep. The page ships with every box as it is set now.</p>
<div class="box ctl" aria-label="Defaults">
  <label><input type="checkbox" id="body"> Task search also reads a node's body text, not just its id and title</label>
  <label><input type="checkbox" id="goalon" checked> List search reads a task's goal as well as its id</label>
  <label><input type="checkbox" id="folds"> Keep the fold buttons while a query is set</label>
  <label><input type="checkbox" id="views"> Search also on Chats and the artefact and run views</label>
</div>
<label for="q" class="small">Query (try: wal, journal, fsync)</label>
<input id="q" type="search" value="journal" autocomplete="off">
<h2>On a task</h2>
<ul class="rows" id="nodes"></ul>
<h2>On the list</h2>
<ul class="rows" id="tasks"></ul>
<p class="small" id="note"></p>
<script>
  var NODES = [
    ["W9.1", "Choose a journal mode", "Compare wal and delete under load.", true],
    ["W9.2", "Measure fsync cost", "Needs journal_mode set to wal first.", false],
    ["W9.3", "Write the migration", "Touches only the schema table.", false]
  ];
  var TASKS = [["W9", "Make the store durable"], ["W12", "Journal compaction for the audit log"], ["W14", "Speed up startup"]];
  function on(id) { return document.getElementById(id).checked; }
  function hit(q, h) { h = h.toLowerCase(); return q.toLowerCase().split(/\s+/).filter(Boolean).every(function (w) { return h.indexOf(w) >= 0; }); }
  function esc(s) { return s.replace(/[&<>]/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }
  function draw() {
    var q = document.getElementById("q").value;
    document.getElementById("nodes").innerHTML = NODES.map(function (n) {
      var ok = !q || hit(q, n[0] + " " + n[1] + (on("body") ? " " + n[2] : ""));
      return '<li class="' + (ok ? "" : "out") + (n[3] && (on("folds") || !q) ? " fold" : "") + '"><span class="id">' + n[0] + "</span> " + esc(n[1]) + "</li>";
    }).join("");
    document.getElementById("tasks").innerHTML = TASKS.map(function (t) {
      var ok = !q || hit(q, t[0] + (on("goalon") ? " " + t[1] : ""));
      return '<li class="' + (ok ? "" : "out") + '"><span class="id">' + t[0] + "</span> " + esc(t[1]) + "</li>";
    }).join("");
    document.getElementById("note").textContent = "Struck-through rows are hidden by the search. A fold sign on a row means its fold button is still drawn.";
    if (window.dfsAnswer) window.dfsAnswer.keep();
  }
  ["q", "body", "goalon", "folds", "views"].forEach(function (id) { document.getElementById(id).addEventListener("input", draw); document.getElementById(id).addEventListener("change", draw); });
  window.dfsPageState = function () { return { q: document.getElementById("q").value, on: ["body", "goalon", "folds", "views"].filter(on) }; };
  document.addEventListener("dfs-state", function (e) {
    var s = e.detail || {}; if (s.q != null) document.getElementById("q").value = s.q;
    ["body", "goalon", "folds", "views"].forEach(function (id) { document.getElementById(id).checked = (s.on || []).indexOf(id) >= 0; });
    draw();
  });
  draw();
</script>

<!-- ===== The answer form: keep from here to the end as it is; edit only the options. ===== -->
<style>
  /* The answer form. Its rules all start with .dfs-answer, so the page's own leave it be. */
  .dfs-answer { margin: 28px 0 0; padding: 12px 14px; border: 1.5px solid #333; border-radius: 6px; background: #fff; }
  .dfs-answer h2 { font-size: 16px; margin: 0 0 8px; }
  .dfs-answer p { margin: 8px 0 0; }
  .dfs-answer fieldset { border: 0; margin: 0 0 6px; padding: 0; }
  .dfs-answer legend { padding: 0; margin: 0 0 4px; color: #444; }
  .dfs-answer .opt { display: flex; gap: 10px; align-items: center; min-height: 44px; cursor: pointer; }
  .dfs-answer input[type=radio], .dfs-answer input[type=checkbox] { width: 32px; height: 32px; margin: 0; flex: none; }
  .dfs-answer .note { display: block; margin: 8px 0 2px; }
  .dfs-answer textarea { width: 100%; box-sizing: border-box; font: inherit; min-height: 44px; }
  .dfs-answer .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .dfs-answer button { font: inherit; padding: 10px 14px; min-height: 44px; border: 1.5px solid #333;
                       border-radius: 6px; background: #fff; cursor: pointer; }
  .dfs-answer button:disabled { opacity: .5; cursor: default; }
  .dfs-answer #dfs-parkbox { display: flex; gap: 10px; align-items: center; min-height: 44px; }
  .dfs-answer #dfs-parkbox[hidden] { display: none; }
  .dfs-answer .where { color: #555; font-size: 14px; }
</style>
<section id="dfs-answer" class="dfs-answer" aria-label="Your answer">
  <h2>Your answer</h2>
  <label class="note" for="dfs-note">In your words (optional)</label>
  <textarea id="dfs-note" rows="3"></textarea>
  <div id="dfs-answerbox" hidden>
    <div class="row"><button type="button" id="dfs-send">Send as my answer</button></div>
    <p id="dfs-answer-status" aria-live="polite"></p>
  </div>
  <div id="dfs-rulebox" hidden>
    <label id="dfs-parkbox" hidden><input type="checkbox" id="dfs-park"> Confirming prunes <span id="dfs-parks"></span>, which hold work: park them</label>
    <div class="row">
      <button type="button" id="dfs-confirm">Confirm the node</button>
      <button type="button" id="dfs-refute">Refute the node</button>
    </div>
    <p id="dfs-rule-status" aria-live="polite"></p>
  </div>
  <p class="where" id="dfs-where" aria-live="polite"></p>
</section>

<script>
  // The answer form. Every id in it starts with dfs-, so a page above it may use any id of its own.
  // The page's own script may call dfsAnswer.choose(value) to pick an
  // option from its own controls, define window.dfsPageState() to return what the page
  // should reopen with, and listen for the "dfs-state" event, whose detail is that state.
  // A control that changes that state without picking an option calls dfsAnswer.keep(), or
  // nothing is saved. window.dfsAnswer does not exist while the page's own script runs
  // (this one comes after it): call it from a handler, or guard with if (window.dfsAnswer).
  //
  // The server this page came from keeps what the reader chose, so the page opens as they
  // left it; it records the answer when an open raise names this page ("Answer with: ...")
  // and rules on the node whose Hypothesis names it (verdict: confirmed or refuted). Opened
  // from a file (the artefact check) there is no server and the form only says so. Send
  // text/plain (a JSON string, no header): that needs no preflight, which the server never grants.
  (function () {
    var API = /^https?:$/.test(location.protocol) ? '/artefact-state/' + location.pathname.split('/').pop() : '';
    function call(method, body) {
      if (!API) return Promise.reject(new Error('no server'));
      return fetch(API, { method: method, body: body && JSON.stringify(body) }).then(function (r) {
        return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); return j; });
      });
    }
    function $(id) { return document.getElementById(id); }
    function radios() { return Array.prototype.slice.call(document.querySelectorAll('#dfs-answer input[name="dfs-option"]')); }
    function option() { var r = radios().filter(function (r) { return r.checked; })[0]; return r ? r.value : ''; }
    // What the author reads in the log: the option, then their own words.
    function said() { return [option(), $('dfs-note').value.trim()].filter(Boolean).join('\n\n'); }
    var touched = false, saving;
    function mine() {
      return { option: option(), note: $('dfs-note').value,
               page: typeof window.dfsPageState === 'function' ? window.dfsPageState() : null };
    }
    function keep() {
      touched = true;
      clearTimeout(saving);
      saving = setTimeout(function () { call('POST', { state: mine() }).catch(function () {}); }, 300);
    }
    window.dfsAnswer = {
      choose: function (value) { radios().forEach(function (r) { r.checked = r.value === value; }); keep(); },
      keep: keep
    };
    radios().forEach(function (r) { r.addEventListener('change', keep); });
    $('dfs-note').addEventListener('input', keep);

    function done(status, text) {
      status.textContent = text;
      parent.postMessage({ dfs: 'answered' }, '*');   // the web page's form closes; nothing, opened alone
    }
    function rule(verdict) {
      var status = $('dfs-rule-status'), buttons = document.querySelectorAll('#dfs-rulebox button');
      if (verdict === 'confirmed' && !$('dfs-parkbox').hidden && !$('dfs-park').checked) {
        status.textContent = 'Tick the box to park the siblings first: confirming prunes them.';
        return;
      }
      var text = said() || (verdict === 'confirmed' ? 'Confirmed' : 'Refuted') + ' on the page.';
      buttons.forEach(function (b) { b.disabled = true; });
      call('POST', { state: mine(), verdict: verdict, answer: text, park: $('dfs-park').checked }).then(function () {
        done(status, 'Recorded: ' + verdict + '.');
      }).catch(function (e) {
        buttons.forEach(function (b) { b.disabled = false; });
        status.textContent = 'Not recorded: ' + e.message;
      });
    }
    $('dfs-confirm').addEventListener('click', function () { rule('confirmed'); });
    $('dfs-refute').addEventListener('click', function () { rule('refuted'); });
    $('dfs-send').addEventListener('click', function () {
      var status = $('dfs-answer-status'), send = $('dfs-send'), text = said();
      if (!text) { status.textContent = 'Choose an option, or write your answer, first.'; return; }
      send.disabled = true;
      call('POST', { state: mine(), answer: text }).then(function () {
        done(status, 'Recorded as your answer.');
      }).catch(function (e) { send.disabled = false; status.textContent = 'Not recorded: ' + e.message; });
    });

    if (!API) { $('dfs-where').textContent = 'Opened as a file: send the answer from the roadmap’s web page.'; return; }
    call('GET').then(function (j) {
      var s = j.state || {};
      if (!touched) {
        if (s.option) radios().forEach(function (r) { r.checked = r.value === s.option; });
        if (s.note) $('dfs-note').value = s.note;
      }
      if (s.page != null) document.dispatchEvent(new CustomEvent('dfs-state', { detail: s.page }));
      $('dfs-rulebox').hidden = !j.node;
      // Confirming prunes the later siblings; the server wants the author's yes for those holding work.
      var parks = (j.node && j.node.parks) || [];
      $('dfs-parks').textContent = parks.join(', ');
      $('dfs-parkbox').hidden = !parks.length;
      $('dfs-answerbox').hidden = !j.raise;
      $('dfs-where').textContent = j.raise || j.node ? '' : 'Nothing waits on this page now: its raise is answered, or its node ruled on.';
    }).catch(function () { $('dfs-where').textContent = 'The roadmap’s server did not answer: answer in the terminal.'; });
  })();
</script>
